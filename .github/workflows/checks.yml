name: Checks

# Runs on every pull request into dev or main (and on pushes to them).
# Read-only: it can't publish anything, and pull requests from forks get no secrets.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build
        run: |
          call .\build.cmd
          if errorlevel 1 exit /b 1

      # Tests that need real monitors aren't part of this repo.
      - name: Build and run tests
        run: |
          xcopy /e /i /y tests\fixtures fixtures >nul
          rem portable.txt keeps the test runs' own files (crash.log and so on) in this folder
          echo tests>portable.txt
          rem one test program for every suite (tests\Runner.cs): it runs each suite in turn and fails if any does
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /main:TestRunner /r:RaceMode.exe /r:System.Core.dll /r:System.Web.Extensions.dll /out:Tests.exe tests\*.cs
          if errorlevel 1 exit /b 1
          .\Tests.exe
          if errorlevel 1 exit /b 1
